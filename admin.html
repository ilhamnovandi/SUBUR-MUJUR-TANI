/* =========================

database.ref("pesanan")

.on(

"value",

function(snapshot){



let data=snapshot.val();



/* Sinkronisasi pengiriman lama:
   jika resi/order Biteship sudah ada dan status masih Dikemas,
   pesanan harus dianggap sudah Dikirim. Ini membuat pesanan lama
   tetap benar meskipun webhook sebelumnya masuk sebelum perbaikan. */
if(data && typeof data === "object"){
  const activeShipment = new Set(["confirmed","allocated","picking_up","picked","dropping_off","on_delivery","out_for_delivery","in_transit","delivering","ready_to_ship"]);
  const migrate = {};
  for(const [oid, ov] of Object.entries(data)){
    if(!ov || typeof ov !== "object") continue;
    const ship = String(ov.statusPengiriman || "").toLowerCase().trim();
    const hasShipment = Boolean(ov.resi || ov.biteshipOrderId || ov.biteshipTrackingId);
    const delivered = ["delivered","success","completed","complete"].includes(ship);
    const cancelled = ["cancelled","rejected","returned"].includes(ship);
    if(hasShipment && (ov.status === "Dikemas" || ov.status === "Diproses") && !delivered && !cancelled){
      migrate[oid + "/status"] = "Dikirim";
      migrate[oid + "/statusKategori"] = "Dikirim";

      data[oid].statusKategori = "Dikirim";
    } else if(activeShipment.has(ship) && ov.status !== "Dikirim" && !delivered && !cancelled){

      migrate[oid + "/statusKategori"] = "Dikirim";

      data[oid].statusKategori = "Dikirim";

  }
  if(Object.keys(migrate).length){
    database.ref("pesanan").update(migrate).catch(err => console.error("Sinkronisasi status pengiriman:", err));
  }
}

let hasil="";





if(!data){


hasil="<p>Belum ada pesanan.</p>";


}

else{



for(let id in data){



const orderStatus = data[id].status || "Menunggu Pembayaran";
const bolehHapus = !data[id].biteshipOrderId && !data[id].resi && ["Pembayaran Ditolak","Ditolak","Dibatalkan","Batal","Belum Bayar","Menunggu Pembayaran","Menunggu Konfirmasi COD"].includes(orderStatus);

      <option value="Dikirim" ${orderStatus === "Dikirim" ? "selected" : ""}>🚚 Dikirim</option>
      <option value="Beri Penilaian" ${orderStatus === "Beri Penilaian" || orderStatus === "Selesai" ? "selected" : ""}>⭐ Beri Penilaian</option>
      <option value="Dibatalkan" ${orderStatus === "Dibatalkan" || orderStatus === "Ditolak" ? "selected" : ""}>❌ Dibatalkan</option>
      <option value="Dikembalikan" ${orderStatus === "Dikembalikan" ? "selected" : ""}>↩️ Dikembalikan</option>
      <option value="Ditahan" ${orderStatus === "Ditahan" ? "selected" : ""}>⏸️ Ditahan</option>
    </select>
    <button onclick="ubahStatus('${id}', document.getElementById('status-${id}').value)">📝 Simpan</button>
  </div>
  <div class="order-actions">

</div>`;



}

<script>


/* =========================
   UBAH STATUS PESANAN
========================= */


async function ubahStatus(id, selectedStatus){
    try {
        const ref = database.ref("pesanan/" + id);
        const snap = await ref.once("value");
        const order = snap.val();
        if(!order) return alert("Pesanan tidak ditemukan.");

        const current = order.status || "Menunggu Pembayaran";
        const isCOD = String(order.metodePembayaran || "").toUpperCase() === "COD";
        const normalNext = {
            "Belum Bayar":"Dikemas",
            "Menunggu Pembayaran":"Dikemas",
            "Menunggu Konfirmasi COD":"Dikemas",
            "Dikemas":"Buat Pengiriman",
            "Buat Pengiriman":"Resi",
            "Resi":"Dikirim",
            "Dikirim":"Beri Penilaian",
            "Beri Penilaian":"Beri Penilaian"
        };
        const codNext = {
            "Menunggu Konfirmasi COD":"Dikemas",
            "Dikemas":"Buat Pengiriman",
            "Buat Pengiriman":"Resi",
            "Resi":"Dikirim",
            "Dikirim":"Dikirim"
        };
        const next = isCOD ? codNext[current] : normalNext[current];

        if (["Dibatalkan","Dikembalikan","Ditahan"].includes(selectedStatus)) {
            if (current === "Dikirim" && selectedStatus !== "Ditahan") {
                return alert("Pesanan yang sudah Dikirim tidak boleh dibatalkan/dikembalikan dari menu status ini.");
            }
        } else if (selectedStatus !== current && selectedStatus !== next) {
            return alert(`⛔ Alur tidak boleh dilompati.\n\nStatus sekarang: ${current}\nStatus berikutnya: ${next || "tidak tersedia"}`);
        }

        await ref.update({
            status: selectedStatus,
            statusKategori: selectedStatus,
            statusTerakhirDiperbarui: new Date().toLocaleString("id-ID")
        });

        if(order.invoice){
            const trackRef = database.ref("pelacakan/" + order.invoice);
            const trackSnap = await trackRef.once("value");
            const track = trackSnap.val() || {};
            const history = Array.isArray(track.riwayatStatus) ? track.riwayatStatus : [];
            history.push({status:selectedStatus, waktu:new Date().toLocaleString("id-ID")});
            await trackRef.update({
                invoice: order.invoice,
                nama: order.nama || "",
                total: Number(order.total || 0),
                status: selectedStatus,
                statusKategori: selectedStatus,
                resi: order.resi || track.resi || "",
                whatsappLast4: String(order.whatsapp || "").replace(/\D/g, "").slice(-4),
                updatedAt: new Date().toLocaleString("id-ID"),
                riwayatStatus: history.slice(-20)
            });
        }
        alert("✅ Status pesanan diperbarui.");
        location.reload();
    } catch(e) {
        alert("❌ Gagal mengubah status: " + e.message);
    }
}
async function tambahResi(id){
    try {
        const ref = database.ref("pesanan/" + id);
        const snap = await ref.once("value");
        const order = snap.val();
        if(!order) return alert("Pesanan tidak ditemukan.");
        if(order.status !== "Buat Pengiriman") return alert("⛔ Resi hanya bisa diproses setelah pengiriman dibuat.");

        const resi = order.resi || order.biteshipTrackingId || "";
        if(!resi) return alert("Nomor resi belum diterbitkan oleh kurir.");
        await ref.update({
            status:"Resi",
            statusKategori:"Resi",
            statusTerakhirDiperbarui:new Date().toLocaleString("id-ID")
        });
        if(order.invoice){
            await database.ref("pelacakan/" + order.invoice).update({
                resi: resi,
                status:"Resi",
                statusKategori:"Resi",
                updatedAt:new Date().toLocaleString("id-ID")
            });
        }
        alert("✅ Resi tersedia: " + resi + "\n\nTahap berikutnya: Dikirim.");
        location.reload();
    } catch(e) {
        alert("❌ Gagal memproses resi: " + e.message);
    }
}

async function tandaiResiDikirim(id){
    try {
        const ref = database.ref("pesanan/" + id);
        const snap = await ref.once("value");
        const order = snap.val();
        if(!order) return alert("Pesanan tidak ditemukan.");
        if(order.status !== "Resi" || !order.resi) return alert("⛔ Pesanan harus berada di tahap Resi dan memiliki nomor resi.");
        const waktu = new Date().toLocaleString("id-ID");
        await ref.update({status:"Dikirim",statusKategori:"Dikirim",statusTerakhirDiperbarui:waktu});
        if(order.invoice){
            await database.ref("pelacakan/" + order.invoice).update({status:"Dikirim",statusKategori:"Dikirim",updatedAt:waktu});
        }
        alert("✅ Pesanan sekarang berstatus Dikirim.");
        location.reload();
    } catch(e) {
        alert("❌ Gagal mengubah status menjadi Dikirim: " + e.message);
    }
}
async function konfirmasiCOD(id){
    try {
        const ref = database.ref("pesanan/" + id);
        const snap = await ref.once("value");
        const order = snap.val();
        if(!order) return alert("Pesanan tidak ditemukan.");
        if(String(order.metodePembayaran || "").toUpperCase() !== "COD") return alert("Pesanan ini bukan COD.");
        if(order.status !== "Menunggu Konfirmasi COD") return alert("⛔ Konfirmasi COD hanya bisa dilakukan pada tahap Menunggu Konfirmasi COD.");
        const waktu = new Date().toLocaleString("id-ID");
        await ref.update({
            status:"Dikemas",
            statusKategori:"Dikemas",
            statusPembayaran:"COD Dikonfirmasi",
            dikonfirmasiPada:waktu,
            statusTerakhirDiperbarui:waktu
        });
        if(order.invoice){
            const trackRef = database.ref("pelacakan/" + order.invoice);
            const trackSnap = await trackRef.once("value");
            const track = trackSnap.val() || {};
            const history = Array.isArray(track.riwayatStatus) ? track.riwayatStatus : [];
            history.push({status:"Dikemas", waktu:waktu});
            await trackRef.update({status:"Dikemas",statusKategori:"Dikemas",updatedAt:waktu,riwayatStatus:history.slice(-20)});
        }
        alert("✅ COD dikonfirmasi. Pesanan masuk tahap Dikemas.");
        location.reload();
    } catch(e) {
        alert("❌ Gagal konfirmasi COD: " + e.message);
    }
}
