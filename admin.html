<script>


/* =========================
   HAPUS PRODUK
========================= */


function hapusProduk(id){



let yakin = confirm(

"Yakin ingin menghapus produk ini?"

);



if(yakin){


database.ref(

"produk/" + id

)

.remove();



}



}

function editProduk(id){

    database.ref("produk/"+id).once("value").then(function(snapshot){

        const data = snapshot.val();

        editID = id;

        document.getElementById("namaProduk").value = data.nama || "";
        document.getElementById("hargaProduk").value = data.harga || "";
        document.getElementById("stokProduk").value = data.stok || "";
        document.getElementById("gambarProduk").value = data.gambar || "";

        previewGambar();

        document.getElementById("btnProduk").innerHTML = "💾 Simpan Perubahan";

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    });

}






</script>

<script>


/* =========================
   VERIFIKASI PEMBAYARAN
========================= */


async function verifikasiBayar(id){

    const bayarRef = database.ref("pembayaran/" + id);
    const bayarSnap = await bayarRef.once("value");
    const bayar = bayarSnap.val();

    if(!bayar || !bayar.produk){
        alert("Data produk tidak ditemukan.");
        return;
    }

    const produkRef = database.ref("produk/" + bayar.produk);
    const produkSnap = await produkRef.once("value");
    const produk = produkSnap.val();

    if(!produk){
        alert("Produk tidak ditemukan.");
        return;
    }

    if(produk.stok < bayar.jumlah){
        alert("Stok tidak mencukupi.");
        return;
    }

    await produkRef.update({
        stok: produk.stok - bayar.jumlah
    });

    await bayarRef.update({
        status: "Lunas"
    });

    alert("Pembayaran berhasil diverifikasi dan stok dikurangi.");
}


</script>

<script>


function logout(){


firebase.auth()

.signOut()

.then(()=>{


window.location="login.html";


});


}



let editID = null;

async function tambahProduk(){

    try{

        const produk = {
    nama: document.getElementById("namaProduk").value.trim(),
    harga: parseInt(
        document.getElementById("hargaProduk").value.replace(/\D/g, "")
    ) || 0,
    stok: parseInt(
        document.getElementById("stokProduk").value
    ) || 0,
    gambar: document.getElementById("gambarProduk").value.trim()
};

        if(editID){
          
          console.log(produk);

            await database.ref("produk/"+editID).update(produk);

            alert("Produk berhasil diperbarui");

        }else{

            await database.ref("produk").push(produk);

            alert("Produk berhasil ditambahkan");

        }

        editID = null;

        document.getElementById("btnProduk").innerHTML = "➕ Tambah Produk";

        kosongkanForm();
        
        document.getElementById("previewProduk").src = "";
document.getElementById("previewProduk").style.display = "none";

    }catch(err){

        console.error(err);

        alert(err.message);

    }

}

function previewGambar(){

    const url = document.getElementById("gambarProduk").value;
    const img = document.getElementById("previewProduk");

    if(url.trim()==""){

        img.style.display="none";
        img.src="";

    }else{

        img.src=url;
        img.style.display="block";

    }

}

function kosongkanForm(){

    document.getElementById("namaProduk").value = "";
    document.getElementById("hargaProduk").value = "";
    document.getElementById("stokProduk").value = "";
    document.getElementById("gambarProduk").value = "";

    document.getElementById("previewProduk").src = "";
    document.getElementById("previewProduk").style.display = "none";

}

function filterPesanan(){

    let input = document.getElementById("cariPesanan").value.toLowerCase();

    let card = document.getElementsByClassName("card");

    for(let i=0;i<card.length;i++){

        let teks = card[i].innerText.toLowerCase();

        if(teks.indexOf(input)>-1){

            card[i].style.display="block";

        }else{

            card[i].style.display="none";

        }

    }

}

</script>
