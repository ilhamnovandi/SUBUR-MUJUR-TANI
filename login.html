<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Login Admin - SUBUR MUJUR TANI
</title>


<style>

body{

font-family: Arial, sans-serif;

background:#e8f5e9;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

margin:0;

}


.login-box{

background:white;

width:90%;

max-width:380px;

padding:25px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,0.2);

}


h2{

text-align:center;

color:#1b5e20;

}


input{

width:100%;

padding:12px;

margin:8px 0;

box-sizing:border-box;

border-radius:8px;

border:1px solid #ccc;

}


button{

width:100%;

padding:12px;

background:#2e7d32;

color:white;

border:none;

border-radius:8px;

font-size:16px;

cursor:pointer;

}


button:hover{

background:#1b5e20;

}


#pesan{

color:red;

text-align:center;

}


</style>

</head>


<body>


<div class="login-box">


<h2>
🌱 Admin SUBUR MUJUR TANI
</h2>


<input 
type="email"
id="email"
placeholder="Email Admin"
>


<input 
type="password"
id="password"
placeholder="Password"
>


<button onclick="login()">

Masuk

</button>


<p id="pesan"></p>


</div>



<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>


<script>


const firebaseConfig = {

apiKey: "AIzaSyCAnApRscAHXJF-NWt3P_BivrvWzGt996U",

authDomain: "subur-mujur-tani-6ff54.firebaseapp.com",

projectId: "subur-mujur-tani-6ff54",

storageBucket: "subur-mujur-tani-6ff54.firebasestorage.app",

messagingSenderId: "338009458768",

appId: "1:338009458768:web:c562a610cee4940b856955"

};


firebase.initializeApp(firebaseConfig);



function login(){


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



firebase.auth()

.signInWithEmailAndPassword(
email,
password
)


.then(function(){


window.location="admin.html";


})


.catch(function(error){


document.getElementById("pesan").innerHTML =

"Login gagal: " + error.message;


});


}


</script>


</body>

</html>
