<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b3d2e">
<title>Lokasi — SUBUR MUJUR TANI</title>
<link rel="stylesheet" href="navigasi.css">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#faf9f5 0%,#f3f5f1 100%);
  color:#1d2923;
  font-family:Inter,Arial,Helvetica,sans-serif;
}
header{
  background:linear-gradient(135deg,#071f18,#0b3d2e,#18513b);
  color:#fff;
  padding:26px 20px;
  text-align:center;
}
header h1{margin:0 0 5px;font-size:28px}
header p{margin:0;color:#e8eee9}
.container{width:min(1000px,92%);margin:0 auto;padding:28px 0}
.box{
  background:#fffdf8;
  border:1px solid #e7e1d4;
  border-radius:22px;
  padding:24px;
  box-shadow:0 14px 38px rgba(8,47,35,.10);
}
h2{color:#0b3d2e;margin:0 0 18px;font-size:28px}
.map-card{
  text-align:center;
  padding:28px 18px;
  border:1px solid #e5ebe7;
  border-radius:16px;
  background:#f8fbf9;
}
.map-card p{color:#53615b;line-height:1.7}
.map-card a{
  display:inline-block;
  padding:13px 18px;
  border-radius:10px;
  background:#1b5e20;
  color:#fff;
  text-decoration:none;
  font-weight:700;
}
</style>
</head>
<body>
<header>
  <h1>🌱 SUBUR MUJUR TANI</h1>
  <p>Pusat Bibit Tanaman Hortikultura Berkualitas</p>
</header>
<main class="container">
  <div class="box">
    <h2>📍 Lokasi Toko</h2>
    <div class="map-card">
      <p>Kunjungi lokasi toko SUBUR MUJUR TANI di Google Maps.</p>
      <a href="https://maps.app.goo.gl/yvHxge7Mmd2Rk7zW6" target="_blank" rel="noopener noreferrer">
        📍 Buka Lokasi Toko di Google Maps
      </a>
    </div>
  </div>
</main>
<script src="navigasi.js"></script>
</body>
</html>
