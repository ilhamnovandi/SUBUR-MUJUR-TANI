[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Biteship webhook: gunakan route khusus ini agar validasi tidak
# bergantung pada route wildcard.
[[redirects]]
  from = "/api/biteship-webhook"
  to = "/.netlify/functions/biteship-webhook"
  status = 200
  force = true

# Route API lain yang sudah dipakai website.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
