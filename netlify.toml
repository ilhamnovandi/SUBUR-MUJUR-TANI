[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Public Biteship webhook route. Use this URL in Biteship dashboard.
[[redirects]]
  from = "/api/biteship-webhook"
  to = "/.netlify/functions/biteship-webhook"
  status = 200
  force = true

# Endpoint API ongkir yang stabil untuk frontend.
[[redirects]]
  from = "/api/ongkir"
  to = "/.netlify/functions/ongkir"
  status = 200
  force = true

# Endpoint tarif Biteship khusus Admin.
[[redirects]]
  from = "/api/biteship-rates"
  to = "/.netlify/functions/biteship-rates"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# BITESHIP_ORIGIN_ORGANIZATION is a public business/organization identifier,
# not a credential. Netlify otherwise treats its configured value as a secret
# when documentation/build files contain that same value.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "BITESHIP_ORIGIN_ORGANIZATION"
