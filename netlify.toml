[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Public Biteship webhook route. Use this URL in Biteship dashboard.
[[redirects]]
  from = "/api/biteship-webhook"
  to = "/.netlify/functions/biteship-webhook"
  status = 200
  force = true

# Endpoint API ongkir yang stabil untuk frontend.
[[redirects]]
  from = "/api/ongkir"
  to = "/.netlify/functions/ongkir"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
